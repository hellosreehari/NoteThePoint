<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found. Return to NoteThePoint for quick, private notes.">
    <meta name="theme-color" content="#242424">
    <title>404 - Page Not Found | NoteThePoint</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root {
            --bg-main: #ffffff;
            --text-main: #242424;
            --text-muted: #6b6b6b;
            --accent-hover: #f5f5f5;
            --btn-primary-bg: #242424;
            --btn-primary-text: #ffffff;
            --font-sans: sohne, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        body.dark-theme {
            --bg-main: #121212;
            --text-main: #e5e5e5;
            --text-muted: #a3a3a3;
            --accent-hover: #262626;
            --btn-primary-bg: #e5e5e5;
            --btn-primary-text: #121212;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--font-sans); background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; -webkit-font-smoothing: antialiased; }
        .error-container { max-width: 400px; }
        h1 { font-size: 80px; font-weight: 800; letter-spacing: -0.05em; margin-bottom: 8px; }
        p { font-size: 18px; color: var(--text-muted); margin-bottom: 32px; }
        .home-btn { display: inline-block; background: var(--btn-primary-bg); color: var(--btn-primary-text); padding: 12px 32px; border-radius: 99px; text-decoration: none; font-size: 16px; font-weight: 600; }
        .theme-toggle { position: fixed; top: 24px; right: 24px; background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .theme-toggle:hover { color: var(--text-main); background: var(--accent-hover); }
    </style>
    <meta name="google-adsense-account" content="ca-pub-8713149607224836">
</head>
<body>
    <div class="error-container">
        <h1>404</h1>
        <p>This page seems to have disappeared, but your notes are still waiting for you.</p>
        <a href="/" class="home-btn">Back to Notepad</a>
    </div>
    <button onclick="toggleTheme()" class="theme-toggle" title="Toggle Dark Mode" aria-label="Toggle Dark Mode">
        <svg id="moon-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <svg id="sun-icon" style="display: none;" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </button>
    <script>
        function initTheme() {
            if (localStorage.getItem('minimalist_theme') === 'dark' || (!localStorage.getItem('minimalist_theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-theme');
                document.getElementById('moon-icon').style.display = 'none';
                document.getElementById('sun-icon').style.display = 'block';
            }
        }
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-theme');
            localStorage.setItem('minimalist_theme', isDark ? 'dark' : 'light');
            document.getElementById('moon-icon').style.display = isDark ? 'none' : 'block';
            document.getElementById('sun-icon').style.display = isDark ? 'block' : 'none';
        }
        initTheme();
    </script>
</body>
</html>
